<!doctype html><html><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif}.tab{position:absolute;right:0;top:0;width:42px;height:176px;border-radius:18px 0 0 18px;background:linear-gradient(145deg,#090b0f,#181c24);box-shadow:-8px 0 24px #0008, inset 1px 0 #ffffff18;cursor:pointer;transition:width .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}.tab:hover{width:58px;box-shadow:-12px 0 30px #00bfff44,inset 1px 0 #ffffff26}.eyes{position:absolute;left:50%;top:50%;display:flex;gap:7px;transform:translate(-50%,-50%)}.eye{width:7px;height:18px;border-radius:50%;background:#dffaff;box-shadow:0 0 7px #8deaff,0 0 16px #00bfff;animation:breathe 2.4s ease-in-out infinite}.eye:nth-child(2){animation-delay:.25s}@keyframes breathe{50%{height:14px;opacity:.72;box-shadow:0 0 4px #8deaff,0 0 10px #00bfff}}
</style></head><body><div class="tab" id="tab"><div class="eyes"><i class="eye"></i><i class="eye"></i></div></div><script>tab.onclick=()=>window.omni.openPanel()</script></body></html>
